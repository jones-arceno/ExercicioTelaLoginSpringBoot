<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Bem-vindo</h1>

            <p class="subtitle">
                Entre na sua conta para continuar
            </p>

            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seuemail@email.com"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p id="mensagem"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
